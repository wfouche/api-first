[tools]
java = "temurin-25"
jbang = "latest"
node = "24"
"npm:@typespec/compiler" = "latest"

[tasks.install-npms]
description = "Install NPM packagaes for TypeSpec"
dir = "01-typespec"
run = """
    npm install --save-dev @typespec/http
    npm install --save-dev @typespec/http-client-js
    npm install --save-dev @typespec/library-linter
    npm install --save-dev @typespec/openapi3
    npm install --save-dev @typespec/rest
    npm install --save-dev @typespec/versioning
"""

[tasks.codegen-openapi-yaml]
dir = "01-typespec"
run = """
    tsp compile main.tsp --output-dir ../02-spring-boot/src/main/resources/static
    tsp format main.tsp
"""

[tasks.codegen-spring-boot]
run = """
jbang org.openapitools:openapi-generator-cli:RELEASE generate \
    -g spring \
    -i 02-spring-boot/src/main/resources/static/openapi.yaml \
      --api-package=org.example.wsv.generated.openapi.api \
    --model-package=org.example.wsv.generated.openapi.dto \
    -o ./generated-code \
    --additional-properties=\
interfaceOnly=true,\
useSpringBoot4=true,\
useJspecify=true,\
openApiNullable=false,\
hideGenerationTimestamp=true

rsync -a --delete ./generated-code/src/main/java/org/example/wsv/generated/openapi ./02-spring-boot/src/main/java/org/example/wsv/generated/openapi

rm -f -r ./generated-code
"""
